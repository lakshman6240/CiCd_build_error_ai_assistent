name: Global Failure Handler
permissions: 
  actions: read 
  contents: read
on:
  workflow_run:
    workflows:
      - Node.js CI
    types:
      - completed

jobs:
  handle-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print failure message
        run: echo "🚨 CI workflow failed! Take action."

      - name: Example - Send notification (placeholder)
        run: echo "You can integrate Slack, email, etc."

      - name: Print
        run: echo "${{ github.event.workflow_run.name }}"

      - name: Curl
        run: curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs -o logs.zip