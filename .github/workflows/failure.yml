name: Global Failure Handler

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows:
      - Node.js CI
    types:
      - completed

jobs:
  handle-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print failed workflow
        run: echo "Failed: ${{ github.event.workflow_run.name }}"
