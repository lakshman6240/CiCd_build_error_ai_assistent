name: Global Failure Handler

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows:
      - Node.js CI
    types:
      - completed

jobs:
  handle-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print failed workflow
        run: echo "Failed: ${{ github.event.workflow_run.name }}"

      - name: Download logs
        run: |
          curl -L \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs \
          -o logs.zip

      - name: Debug files
        run: ls -lh

      - name: Unzip logs safely
        run: |
          if [ -f logs.zip ]; then
            unzip logs.zip -d logs || echo "Unzip failed"
          else
            echo "logs.zip not found"
          fi

      - name: Show logs
        run: |
          echo "===== ERROR LOGS ====="
          cat logs/* 2>/dev/null || echo "No logs found"

      - name: Show only errors
        run: |
          grep -i "error" logs/* 2>/dev/null || echo "No errors found"