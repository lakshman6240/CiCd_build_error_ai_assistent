name: Global Failure Handler

on:
  workflow_run:
    workflows:
      - Node.js CI
    types:
      - completed

jobs:
  handle-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print failure message
        run: echo "🚨 CI workflow failed! Take action."

      - name: Example - Send notification (placeholder)
        run: echo "You can integrate Slack, email, etc."

      - name: Print failed workflow 
        run: echo "Failed: ${{ github.event.workflow_run.name }}"