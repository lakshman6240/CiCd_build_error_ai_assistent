name: Global Failure Handler

on:
  workflow_run:
    workflows: ["*"]   # listen to ALL workflows
    types:
      - completed

jobs:
  handle-failure:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.name != 'Global Failure Handler'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Print failed workflow name
        run: echo "❌ Workflow failed: ${{ github.event.workflow_run.name }}"

      - name: Print branch
        run: echo "Branch: ${{ github.event.workflow_run.head_branch }}"

      - name: Print URL
        run: echo "Run URL: ${{ github.event.workflow_run.html_url }}"

      - name: Notification placeholder
        run: echo "Send Slack / Email here"